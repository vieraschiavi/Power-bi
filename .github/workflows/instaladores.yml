# Construye los instaladores de Windows y los PRUEBA instalándolos.
#
# Existe porque el desarrollo pasa en Linux y un .exe de Windows no se puede
# ni compilar ni ejecutar ahí: sin este runner, "el instalador funciona" sería
# una afirmación sin respaldo. Acá se instala de verdad, se arranca el motor
# empaquetado, se comprueba el candado de la edición, se corre
# Convertir-a-version-dueno.bat y se desinstala.
#
# Las ediciones OWNER y DEMO no van en los artifacts —los de un repo público
# los baja cualquiera con una cuenta de GitHub— pero sí quedan disponibles para
# el dueño en un release BORRADOR (último paso del job): GitHub se los muestra
# solo a las cuentas con permiso de escritura sobre el repo. La demo se entrega
# a pedido, en una reunión 1:1, no se descarga sola. Alternativas sin pasar
# por el CI: daxlingo/desktop/CONSTRUIR_OWNER.bat en tu máquina, o instalar la
# de cliente y pasarle Convertir-a-version-dueno.bat.

name: Instaladores de Windows

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "daxlingo/desktop/**"
      - "daxlingo/dxl/**"
      - "daxlingo/app/**"
      - "daxlingo/requirements-app.txt"
      - ".github/workflows/instaladores.yml"

# `write` porque el último paso deja el instalador OWNER en un release
# BORRADOR. Es el permiso mínimo que permite crear releases; no hace falta
# nada más (ni packages, ni id-token).
permissions:
  contents: write

# Cada push a la misma rama deja obsoleta la corrida anterior, y esta tarda
# entre 20 y 45 minutos en un runner de Windows. Sin esto quedaban dos o tres
# corridas viejas terminando en paralelo, gastando runner para responder una
# pregunta que ya no importa — y ensuciando la lectura de "¿cómo está la rama?"
# con resultados de commits que ya no existen.
concurrency:
  group: instaladores-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_EMBED: "3.11.9"
  # A propósito NO es una ruta por defecto de NSIS: así la instalación solo se
  # puede encontrar leyendo el registro, que es lo que hay que probar.
  INSTALL_DIR: "C:\\pruebainstal"
  # Desde acá se corre el .bat de owner, lejos de la instalación.
  OWNER_DIR: "C:\\prueba-owner"
  # OTRA_UNIDAD no se define acá: la letra de la segunda unidad se descubre
  # en caliente (paso "Elegir la otra unidad") y se publica por GITHUB_ENV,
  # así que los pasos de más abajo la leen como $env:OTRA_UNIDAD. Ponerle un
  # default acá sería tener dos fuentes para el mismo dato.

jobs:
  construir-y-probar:
    runs-on: windows-latest
    # 45 min alcanzaba para un solo ciclo instalar→verificar→desinstalar.
    # Ahora hay tres (el original + los dos que prueban que se puede elegir
    # disco), y cada uno puede necesitar hasta 5 reintentos por la caída
    # intermitente de más abajo — con margen para que un mal día no tape el
    # trabajo real con un timeout que no es culpa de este cambio.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ------------------------------------------------------------------
      # Runtime de Python embebido: es lo que hace que el cliente no tenga
      # que instalar Python. La carpeta va vacía en el repo (ver
      # desktop/runtime/LEEME.md), así que se arma acá.
      # ------------------------------------------------------------------
      - name: Preparar el runtime de Python embebido
        shell: pwsh
        working-directory: daxlingo/desktop
        run: |
          $ver = "${{ env.PYTHON_EMBED }}"
          $zip = "python-$ver-embed-amd64.zip"
          Invoke-WebRequest "https://www.python.org/ftp/python/$ver/$zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath runtime -Force
          Remove-Item $zip

          # Sin descomentar `import site`, pip instala pero nada se importa:
          # el runtime embebido arranca con el sistema de paquetes apagado.
          $pth = Get-ChildItem runtime -Filter "python*._pth" | Select-Object -First 1
          (Get-Content $pth.FullName) -replace '^#\s*import site', 'import site' |
            Set-Content $pth.FullName

          Invoke-WebRequest "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          .\runtime\python.exe get-pip.py --no-warn-script-location
          Remove-Item get-pip.py
          .\runtime\python.exe -m pip install --no-warn-script-location `
            -r ..\requirements-app.txt

      - name: Comprobar que el runtime arranca solo
        shell: pwsh
        working-directory: daxlingo/desktop
        run: |
          .\runtime\python.exe -c "import sys, streamlit; print('python', sys.version); print('streamlit', streamlit.__version__)"

      - name: Instalar dependencias de Node
        working-directory: daxlingo/desktop
        run: npm install

      # ------------------------------------------------------------------
      # El secreto que firma las licencias.
      #
      # Este job prueba que el instalador de Windows instala, arranca, aguanta
      # el candado de edición y desinstala. Para eso necesita UN secreto — no
      # necesita EL secreto de producción. Antes el job moría en el primer
      # paso cuando el repositorio no tenía configurado
      # `MVDAX_LICENSE_SECRET`, y con eso se perdían las otras quince
      # comprobaciones: el check quedaba rojo permanente y dejaba de decir
      # nada sobre el código.
      #
      # Ahora, si el secreto de producción no está, se genera uno AL AZAR
      # para esta corrida. Todo el resto del job corre igual. Lo único que
      # cambia es que el instalador de cliente NO se publica —está sellado
      # con una clave descartable, así que rechazaría las licencias reales—
      # y el resumen del job lo dice con todas las letras.
      #
      # El guard de scripts/build-instaladores.js NO se tocó: sigue
      # cortando en seco si alguien construye la edición vendida sin secreto.
      # Lo que cambió es que acá se le pasa uno explícito en vez de dejarlo
      # sin nada.
      # ------------------------------------------------------------------
      - name: Resolver el secreto de licencias
        shell: pwsh
        env:
          SECRETO: ${{ secrets.MVDAX_LICENSE_SECRET }}
        run: |
          if ($env:SECRETO) {
            Write-Host "MVDAX_LICENSE_SECRET está configurado: build publicable"
            "SECRETO_REAL=si" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            return
          }

          # `Create().GetBytes([byte[]])` y no el `::Fill()` estático: Fill
          # recibe un Span<byte> y la conversión desde un array de PowerShell
          # no es confiable entre versiones. Esta sobrecarga existe desde
          # siempre y toma el array tal cual.
          $bytes = New-Object byte[] 48
          [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
          $efimero = [Convert]::ToBase64String($bytes)
          # Que no aparezca en ningún log, aunque sea descartable: si se ve
          # uno, se aprende a mirar dónde salen los otros.
          Write-Host "::add-mask::$efimero"

          # Un solo string, sin `+` entre argumentos: `Write-Host "a" + "b"`
          # no concatena, imprime «a + b» (son tres argumentos del comando,
          # no una expresión).
          Write-Host ("::warning::MVDAX_LICENSE_SECRET no está configurado en este " +
                      "repositorio. Se usa una clave descartable para poder probar el " +
                      "instalador, y NO se publica el instalador de cliente: sellado con " +
                      "esa clave rechazaría las licencias que emite la web.")
          "SECRETO_REAL=no" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MVDAX_SECRETO_EFIMERO=$efimero" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # ------------------------------------------------------------------
      # Los tres instaladores. build-instaladores.js compila el front una vez
      # y hornea el sello de cada edición.
      # ------------------------------------------------------------------
      - name: Construir los tres instaladores
        working-directory: daxlingo/desktop
        env:
          MVDAX_LICENSE_SECRET: ${{ secrets.MVDAX_LICENSE_SECRET || env.MVDAX_SECRETO_EFIMERO }}
        run: node scripts/build-instaladores.js todos

      - name: Listar lo construido
        shell: pwsh
        working-directory: daxlingo/desktop
        run: Get-ChildItem dist-instalador -Filter *.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      # ------------------------------------------------------------------
      # Instalación real, silenciosa, en un directorio elegido: eso prueba de
      # una vez el /S, el /D y que el paquete quedó completo.
      # ------------------------------------------------------------------
      - name: Instalar la edición cliente
        shell: pwsh
        working-directory: daxlingo/desktop
        run: |
          $exe = Get-ChildItem dist-instalador -Filter "MV-DAX-Lab-Setup-*.exe" |
                 Select-Object -First 1
          if (-not $exe) { throw "no se generó el instalador de cliente" }
          $destino = "${{ env.INSTALL_DIR }}"
          Write-Host "Instalando $($exe.Name) en $destino"

          # Los parámetros van en UN solo string a propósito: así llegan
          # tal cual, sin que PowerShell les agregue comillas. NSIS exige
          # que /D vaya último y sin comillar.
          #
          #   /S           silencioso
          #   /NCRC        saltea el chequeo CRC del .exe (son 176 MB)
          #   /D=          carpeta destino
          #
          # SIN /currentuser a propósito, aunque antes estaba. Se probó acá
          # (corrida del 17/8) y con nsis.perMachine:true rompe el acceso del
          # menú Inicio: el .exe queda manifestado
          # RequestExecutionLevel=admin —eso lo decide perMachine en tiempo
          # de BUILD, ninguna bandera de línea de comandos lo cambia— así que
          # Windows lo eleva ANTES de que NSIS llegue a leer /currentuser, y
          # esa combinación (proceso elevado + "actuá como si fueras
          # per-user") no está bien soportada. No hace falta forzarla: lo que
          # hay que probar —que /D elige la carpeta— ya queda cubierto acá
          # sin la bandera, y el modo por default (ahora per-machine) tiene
          # su propia prueba dedicada más abajo ("Reinstalar sin decirle
          # carpeta"). Si en algún momento hace falta cobertura del modo
          # per-user puro, que sea con un .exe pensado para eso
          # (perMachine:false), no mezclado con este.
          #
          # Sin -Wait, y con espera acotada a mano: el paquete tiene
          # `nsis.runAfterFinish: true`, así que al terminar el instalador
          # LANZA la app — y `Start-Process -Wait` se queda esperando a un
          # proceso que no va a salir nunca. Así colgó el primer intento
          # hasta el timeout del job.
          #
          # POR QUÉ SE REINTENTA
          # -------------------
          # El instalador se cae de manera INTERMITENTE con -1073741819
          # (0xC0000005) dentro de `System.dll`, el plugin System de NSIS,
          # a los ~2 s de arrancar y sin instalar nada. Pasó en 2 de 4
          # corridas del mismo código. No es el `/currentuser` ni el `/NCRC`
          # —se cayó igual con los dos puestos—, así que la causa sigue sin
          # estar identificada.
          #
          # Se reintenta para que la caída no tape los otros nueve pasos,
          # pero NO se disimula: cada intento fallido sale como ::warning::
          # y al final se dice cuántos hicieron falta. Si esto empieza a
          # necesitar 4 y 5 intentos seguido, es un problema del producto
          # —el cliente vería el mismo crash— y hay que ir al fondo.
          #
          # Cinco intentos y no tres: medido sobre seis instalaciones, la
          # caída sale una de cada dos. Con tres, el job quedaría rojo una
          # de cada ocho veces por una falla que no es del paso.
          $appExe = Join-Path $destino "MV DAX Lab.exe"
          $INTENTOS = 5
          $codigos = @()

          for ($intento = 1; $intento -le $INTENTOS; $intento++) {
            if ($intento -gt 1) {
              Write-Host "::warning::el instalador no dejó nada instalado; reintento $intento de $INTENTOS"
              Remove-Item $destino -Recurse -Force -ErrorAction SilentlyContinue
            }

            $p = Start-Process $exe.FullName -PassThru `
                   -ArgumentList "/S /NCRC /D=$destino"
            if (-not $p.WaitForExit(300000)) {
              $p.Kill()
              throw "el instalador no terminó en 5 minutos"
            }
            $codigos += $p.ExitCode
            Write-Host "intento ${intento}: el instalador salió con $($p.ExitCode)"

            # El código de salida NO decide si terminó: los instaladores de
            # NSIS se relanzan y el proceso de arriba sale antes de que el
            # trabajo termine. Lo que decide es si la app quedó en disco.
            #
            # Pero sí sirve para no esperar al pedo: un instalador que se
            # cayó con 0xC0000005 no va a crear nada nunca, así que ahí se
            # espera 10 s en vez de 120 y se reintenta enseguida.
            $espera = if ($p.ExitCode -eq 0) { 60 } else { 5 }
            foreach ($i in 1..$espera) {
              if (Test-Path $appExe) { break }
              Start-Sleep -Seconds 2
            }

            Get-Process -Name "MV DAX Lab" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "bajando la app que abrió el instalador (PID $($_.Id))"; $_.Kill() }

            if (Test-Path $appExe) { break }
          }

          if ((Test-Path $appExe) -and ($codigos.Count -gt 1)) {
            Write-Host "::warning::la instalación necesitó $($codigos.Count) intentos (códigos: $($codigos -join ', '))"
          }

          if (-not (Test-Path $appExe)) {
            # Que el próximo run no vuelva a ser adivinanza: dónde se miró,
            # y qué dice Windows de la caída.
            Write-Host "--- no apareció $appExe; esto hay en cada candidato ---"
            foreach ($d in @($destino, "$env:LOCALAPPDATA\Programs", $env:ProgramFiles)) {
              Write-Host "· $d"
              Get-ChildItem $d -ErrorAction SilentlyContinue |
                Select-Object -First 20 |
                ForEach-Object { Write-Host "    $($_.Name)" }
            }
            Write-Host "--- caídas que registró Windows ---"
            Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001} `
                         -MaxEvents 5 -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host (($_.Message -split "`n" | Select-Object -First 5) -join ' | ') }
            throw "el instalador no dejó la app instalada en $INTENTOS intentos (códigos: $($codigos -join ', '))"
          }
          Write-Host "la app quedó instalada en $destino"

      - name: Comprobar lo que quedó instalado
        shell: pwsh
        run: |
          $raiz = "${{ env.INSTALL_DIR }}"
          $fallos = @()
          foreach ($r in @(
              "MV DAX Lab.exe",
              "Uninstall MV DAX Lab.exe",
              "resources\app\dxl\licencia.py",
              "resources\app\app\app.py",
              "resources\app\edicion.json",
              "resources\app\datos\demo\modelo_demo.bim",
              "resources\runtime\python.exe")) {
            if (Test-Path (Join-Path $raiz $r)) { Write-Host "  ok   $r" }
            else { $fallos += $r; Write-Host "  FALTA $r" }
          }
          if ($fallos) { throw "faltan en el paquete: $($fallos -join ', ')" }

      - name: Comprobar los accesos directos (escritorio y menú Inicio)
        shell: pwsh
        run: |
          # El de escritorio ya miraba las dos ubicaciones posibles (la del
          # usuario y la de "todos los usuarios", $env:PUBLIC\Desktop) — el
          # de menú Inicio SOLO miraba la de usuario. Con nsis.perMachine
          # ahora en true, el acceso del menú Inicio va legítimamente a la
          # carpeta común ($env:ProgramData\...), así que faltaba mirar ahí:
          # sin esto, hasta una instalación per-machine perfecta salía
          # "FALTA" — no porque el instalador estuviera mal, sino porque el
          # chequeo miraba un solo lugar de los dos posibles.
          $enEscritorio = Get-ChildItem ([Environment]::GetFolderPath('Desktop')),
                                        "$env:PUBLIC\Desktop" -Filter "MV DAX Lab.lnk" -ErrorAction SilentlyContinue
          $enMenu = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs",
                                  "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" `
                                  -Recurse -Filter "MV DAX Lab.lnk" -ErrorAction SilentlyContinue
          Write-Host "escritorio : $(if ($enEscritorio) { $enEscritorio[0].FullName } else { 'NO' })"
          Write-Host "menú Inicio: $(if ($enMenu) { $enMenu[0].FullName } else { 'NO' })"
          if (-not $enEscritorio) { throw "no quedó el acceso en el escritorio" }
          if (-not $enMenu) { throw "no quedó el acceso en el menú Inicio" }

      # ------------------------------------------------------------------
      # El candado de la edición, sobre la instalación de verdad.
      # ------------------------------------------------------------------
      - name: La copia vendida no se convierte en owner con una variable
        shell: pwsh
        run: |
          $raiz = "${{ env.INSTALL_DIR }}"
          $py = Join-Path $raiz "resources\runtime\python.exe"
          $app = Join-Path $raiz "resources\app"
          # Nada de PYTHONPATH: el runtime embebido trae un `._pth` al lado
          # del python.exe, y con ese archivo presente CPython ignora la
          # variable. La carpeta se agrega desde adentro. (La app real no
          # necesita nada de esto: app.py se pone su propia raíz en sys.path.)
          $env:MVDAXLAB_EDICION_ARCHIVO = Join-Path $app "edicion.json"
          $env:MVDAXLAB_DATOS = "$env:TEMP\mvdax-datos"
          $env:MVDAX_EDICION = "owner"          # el intento de bypass
          $ed = & $py -c "import sys; sys.path.insert(0, r'$app'); from dxl import licencia; print(licencia.edicion_actual())"
          Write-Host "edición con MVDAX_EDICION=owner puesta en contra: $ed"
          if ($ed.Trim() -ne "profesional") { throw "el candado no aguantó: $ed" }

      - name: Arrancar la app empaquetada y pedirle una página
        shell: pwsh
        run: |
          $raiz = "${{ env.INSTALL_DIR }}"
          $py = Join-Path $raiz "resources\runtime\python.exe"
          $app = Join-Path $raiz "resources\app"
          $proc = Start-Process $py -PassThru -WindowStyle Hidden -ArgumentList `
            "-m", "streamlit", "run", "$app\app\app.py",
            "--server.port", "8765", "--server.headless", "true",
            "--browser.gatherUsageStats", "false"
          try {
            $ok = $false
            foreach ($i in 1..60) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:8765" -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "la app empaquetada no respondió en 120 s" }
            Write-Host "la app empaquetada respondió 200"
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      # ------------------------------------------------------------------
      # Y ahora el .bat de owner, sobre esa misma instalación.
      #
      # Se corre desde una carpeta NEUTRA, no desde adentro de la instalación:
      # así se ejercita la detección automática de verdad. La app quedó en
      # C:\pruebainstal —que NO es ninguna de las rutas por defecto de NSIS—,
      # así que el .bat solo puede encontrarla leyendo el registro. Corriéndolo
      # desde adentro, como se hacía antes, alcanzaba con mirar su propia
      # carpeta y la búsqueda nunca se probaba.
      # ------------------------------------------------------------------
      - name: Pasar la instalación a owner con Convertir-a-version-dueno.bat
        shell: cmd
        run: |
          mkdir "${{ env.OWNER_DIR }}\scripts" 2>nul
          copy "daxlingo\desktop\Convertir-a-version-dueno.bat" "${{ env.OWNER_DIR }}\" >nul
          copy "daxlingo\desktop\scripts\*.py" "${{ env.OWNER_DIR }}\scripts\" >nul
          cd /d "${{ env.OWNER_DIR }}"
          call Convertir-a-version-dueno.bat < nul > salida.txt 2>&1
          type salida.txt
          findstr /i /c:"${{ env.INSTALL_DIR }}" salida.txt >nul || (echo [X] el .bat no detecto la instalacion en ${{ env.INSTALL_DIR }} & exit /b 1)
          echo OK: la deteccion automatica encontro ${{ env.INSTALL_DIR }}

      - name: Comprobar que quedó en owner, sin clave y sin vencimiento
        shell: pwsh
        run: |
          $raiz = "${{ env.INSTALL_DIR }}"
          $py = Join-Path $raiz "resources\runtime\python.exe"
          $app = Join-Path $raiz "resources\app"
          $env:MVDAXLAB_EDICION_ARCHIVO = Join-Path $app "edicion.json"
          $env:MVDAXLAB_DATOS = "$env:TEMP\mvdax-datos2"
          Remove-Item Env:\MVDAX_EDICION -ErrorAction SilentlyContinue
          # La carpeta de la app va por argumento, no por PYTHONPATH: ver el
          # comentario del paso del candado.
          $salida = (& $py "${{ env.OWNER_DIR }}\scripts\estado_edicion.py" $app).Trim()
          Write-Host "estado tras el .bat: $salida"
          $partes = $salida.Split("|")
          if ($partes[0] -ne "owner") { throw "no quedó en owner: $salida" }
          if ($partes[1] -ne "True")  { throw "la edición owner no está activa" }
          if ($partes[2] -ne "None")  { throw "owner no debería vencer: $salida" }
          if ($partes[3] -ne "")      { throw "quedaron funciones trabadas: $($partes[3])" }

      - name: Revertir y comprobar que vuelve atrás
        shell: cmd
        run: |
          cd /d "${{ env.OWNER_DIR }}"
          call Convertir-a-version-dueno.bat /revertir < nul

      # ------------------------------------------------------------------
      # El bug real que motivó este cambio, probado con el instalador de
      # verdad — no adivinado, leído en el propio node_modules del proyecto
      # (app-builder-lib/templates/nsis/assistedInstaller.nsh +
      # multiUser.nsh): initMultiUser mira si HKCU o HKLM tienen anotada una
      # InstallLocation para esta edición y, si la encuentra, la trata como
      # "esto es una actualización" — reinstala DERECHO ahí y se salta la
      # página donde se podría elegir otra carpeta o disco. Correcto cuando
      # la instalación anterior sigue estando; un bug cuando la carpeta ya
      # no existe (se borró a mano, quedó a medias por el disco lleno) y esa
      # marca fantasma sigue mandando al mismo lugar sin volver a preguntar.
      #
      # Acá se simula exactamente eso: se borra la carpeta SIN desinstalar
      # (así la marca del registro queda), y se reinstala sin decirle nada
      # de carpeta. Sin el arreglo (preInit en build/instalador.nsh), esto
      # recrearía "${{ env.INSTALL_DIR }}" —la carpeta borrada— sin más. Con
      # el arreglo, la marca fantasma se limpia antes de decidir el modo, y
      # cae en el default nuevo: Archivos de programa. De paso, esto prueba
      # también cuál es ese default ahora que nsis.perMachine es true.
      # ------------------------------------------------------------------
      - name: Simular una instalación anterior que ya no está
        shell: pwsh
        run: |
          $vieja = "${{ env.INSTALL_DIR }}"
          if (-not (Test-Path (Join-Path $vieja "MV DAX Lab.exe"))) {
            throw "no había nada instalado en $vieja para poder simular esto"
          }
          Remove-Item $vieja -Recurse -Force
          Write-Host "carpeta borrada a mano (sin desinstalar): $vieja"
          Write-Host "la marca en el registro sigue apuntando ahí — es la parte que hay que probar"

      - name: Reinstalar sin decirle carpeta — no debe caer en la vieja
        shell: pwsh
        working-directory: daxlingo/desktop
        run: |
          $exe = Get-ChildItem dist-instalador -Filter "MV-DAX-Lab-Setup-*.exe" |
                 Select-Object -First 1
          $vieja = "${{ env.INSTALL_DIR }}"
          $porDefecto = Join-Path $env:ProgramFiles "MV DAX Lab"
          $appExe = Join-Path $porDefecto "MV DAX Lab.exe"

          # Mismo patrón de reintentos que la primera instalación (ver ese
          # paso para el porqué de la caída intermitente 0xC0000005), acá
          # SIN /D ni /currentuser a propósito: es justo lo que hay que
          # probar, que el instalador decida solo dónde ir.
          $INTENTOS = 5
          for ($intento = 1; $intento -le $INTENTOS; $intento++) {
            if ($intento -gt 1) {
              Write-Host "::warning::reintento $intento de $INTENTOS"
              Remove-Item $porDefecto -Recurse -Force -ErrorAction SilentlyContinue
            }
            $p = Start-Process $exe.FullName -PassThru -ArgumentList "/S /NCRC"
            if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "no terminó en 5 minutos" }
            $espera = if ($p.ExitCode -eq 0) { 60 } else { 5 }
            foreach ($i in 1..$espera) {
              if (Test-Path $appExe) { break }
              Start-Sleep -Seconds 2
            }
            Get-Process -Name "MV DAX Lab" -ErrorAction SilentlyContinue |
              ForEach-Object { $_.Kill() }
            if (Test-Path $appExe) { break }
          }

          if (Test-Path (Join-Path $vieja "MV DAX Lab.exe")) {
            throw "BUG: volvió a instalar en la carpeta vieja y borrada ($vieja) " +
                  "en vez de preguntar/usar el default — la marca fantasma del " +
                  "registro no se limpió"
          }
          if (-not (Test-Path $appExe)) {
            throw "no quedó instalado en el default esperado ($porDefecto)"
          }
          Write-Host "OK: ignoró la marca fantasma y cayó en el default correcto: $porDefecto"

      - name: Desinstalar la reinstalación por default
        shell: pwsh
        run: |
          $raiz = Join-Path $env:ProgramFiles "MV DAX Lab"
          $des = Join-Path $raiz "Uninstall MV DAX Lab.exe"
          $p = Start-Process $des -ArgumentList '/S' -PassThru
          [void]$p.WaitForExit(180000)
          Start-Sleep -Seconds 15
          if (Test-Path (Join-Path $raiz "MV DAX Lab.exe")) {
            throw "el desinstalador dejó el ejecutable"
          }
          Write-Host "desinstalación limpia"

      # ------------------------------------------------------------------
      # Y la otra mitad de "puedo elegir disco": una unidad que NO es la del
      # sistema. /D sigue siendo la vía —silenciosa, determinística, sin
      # depender de que la página de carpeta se muestre— pero hasta acá
      # nunca se había probado apuntando a una LETRA DE UNIDAD distinta, así
      # que quedaba la duda de si algo en el armado de accesos directos o en
      # el registro asume "todo vive en C:".
      #
      # Acá hubo un intento fallido que conviene dejar anotado para que nadie
      # lo repita: la primera versión creaba la unidad con `subst`. El `dir`
      # la veía perfecto, y aun así el instalador falló 5 de 5 (corrida del
      # 18/8, 23 minutos tirados). El motivo no es el instalador: las
      # unidades de `subst` son POR SESIÓN DE INICIO, y como el paquete ahora
      # es per-machine el .exe se eleva — y el token elevado de UAC es otra
      # sesión, que no ve esa letra. Un `subst` nunca va a servir para probar
      # un instalador elevado.
      #
      # Se usa una unidad DE VERDAD. El runner de Windows trae una D: real
      # (de hecho el workspace vive ahí: D:\a\Power-bi\Power-bi), que es un
      # volumen normal y por lo tanto visible para cualquier proceso, elevado
      # o no. Es además exactamente el caso del pedido: "instalarlo en otro
      # disco, ejemplo el D:". Se descubre en caliente en vez de hardcodear
      # la letra, y si algún día la imagen del runner deja de traer una
      # segunda unidad, el paso falla diciendo eso y no con un misterio.
      # ------------------------------------------------------------------
      - name: Elegir la otra unidad (real, no subst) para la prueba de disco
        shell: pwsh
        run: |
          # DriveType 3 = disco fijo local. Se excluye C: y se pide margen de
          # sobra: la instalación pesa unos 500 MB.
          $otra = Get-CimInstance Win32_LogicalDisk |
                  Where-Object { $_.DriveType -eq 3 -and $_.DeviceID -ne "C:" -and
                                 $_.FreeSpace -gt 2GB } |
                  Sort-Object -Property FreeSpace -Descending |
                  Select-Object -First 1
          if (-not $otra) {
            Get-CimInstance Win32_LogicalDisk |
              Format-Table DeviceID, DriveType, @{n="LibresGB";e={[int]($_.FreeSpace/1GB)}}
            throw "este runner no tiene ninguna unidad fija además de C: con 2 GB libres; " +
                  "sin eso no se puede probar la instalación en otro disco"
          }
          $libres = [int]($otra.FreeSpace / 1GB)
          Write-Host "otra unidad elegida: $($otra.DeviceID) ($libres GB libres)"
          "OTRA_UNIDAD=$($otra.DeviceID)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # ------------------------------------------------------------------
      # OJO CON EL NOMBRE DE LA CARPETA: va SIN espacios, y no es capricho.
      #
      # electron-builder no usa el /D nativo de NSIS para fijar la carpeta:
      # lo reimplementa en multiUser.nsh:86-90 con
      # `${StdUtils.GetParameter} $R0 "D" ""`, y StdUtils parte la línea de
      # comandos estilo argv (su propio header documenta ParameterCnt y
      # ParameterStr como "similar to argc/argv in main()"). O sea que corta
      # en el primer espacio.
      #
      # Con /D=D:\MV DAX Lab pasaba esto, y se ve entero en la corrida del
      # 18/8: el /D nativo —que sí toma el resto de la línea— dejaba
      # $INSTDIR bien y el `SetOutPath $INSTDIR` de installer.nsi:45 creaba
      # "D:\MV DAX Lab"; después initMultiUser lo pisaba con el valor
      # recortado de StdUtils y los archivos terminaban en "D:\MV". El log
      # mostraba las DOS carpetas en D:\ y salida 0 del instalador, cinco
      # veces seguidas.
      #
      # Es una limitación de electron-builder para instalaciones SILENCIOSAS
      # con /D, no del producto: al usuario que instala a mano no lo toca
      # (la página de carpeta escribe $INSTDIR directo), y que la ruta lleve
      # espacios ya está probado en el paso "Reinstalar sin decirle carpeta",
      # que cae en C:\Program Files\MV DAX Lab y pasa. Acá lo que hay que
      # aislar es la LETRA DE UNIDAD, así que la carpeta va sin espacios.
      # ------------------------------------------------------------------
      - name: Instalar en la otra unidad
        shell: pwsh
        working-directory: daxlingo/desktop
        run: |
          $exe = Get-ChildItem dist-instalador -Filter "MV-DAX-Lab-Setup-*.exe" |
                 Select-Object -First 1
          $destino = "$env:OTRA_UNIDAD\MVDAXLab"
          $appExe = "$destino\MV DAX Lab.exe"

          # Candado contra el bug de arriba: si alguien vuelve a poner un
          # espacio en $destino, StdUtils lo va a recortar y los archivos van
          # a caer en la carpeta del primer pedazo. Que falle acá diciendo
          # exactamente eso, en vez de que el paso siguiente muera con un
          # "falta el runtime" que no explica nada.
          if ($destino -match '\s') {
            throw "el destino de esta prueba no puede llevar espacios: " +
                  "electron-builder recorta el /D en el primer espacio (ver el comentario del paso)"
          }

          $INTENTOS = 5
          for ($intento = 1; $intento -le $INTENTOS; $intento++) {
            if ($intento -gt 1) {
              Write-Host "::warning::reintento $intento de $INTENTOS"
              Remove-Item $destino -Recurse -Force -ErrorAction SilentlyContinue
            }
            $p = Start-Process $exe.FullName -PassThru -ArgumentList "/S /NCRC /D=$destino"
            if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "no terminó en 5 minutos" }
            # El código de salida se imprime siempre: cuando esto falló con
            # `subst`, el instalador salía 0 y no escribía nada, y sin este
            # dato costó entender que el problema era que el proceso elevado
            # no veía la unidad. Un 0 que no deja archivos dice mucho más que
            # un "no quedó instalado" a secas.
            Write-Host "intento $intento · salida del instalador: $($p.ExitCode)"
            $espera = if ($p.ExitCode -eq 0) { 60 } else { 5 }
            foreach ($i in 1..$espera) {
              if (Test-Path $appExe) { break }
              Start-Sleep -Seconds 2
            }
            Get-Process -Name "MV DAX Lab" -ErrorAction SilentlyContinue |
              ForEach-Object { $_.Kill() }
            if (Test-Path $appExe) { break }
          }
          if (-not (Test-Path $appExe)) {
            Write-Host "contenido de $env:OTRA_UNIDAD\ :"
            Get-ChildItem "$env:OTRA_UNIDAD\" -ErrorAction SilentlyContinue |
              Select-Object Name, Mode | Format-Table
            throw "no quedó instalado en la otra unidad ($destino) tras $INTENTOS intentos"
          }
          Write-Host "instalado en $destino"

      - name: Arrancar desde la otra unidad — confirmar que no es solo un archivo copiado
        shell: pwsh
        run: |
          $py = "$env:OTRA_UNIDAD\MVDAXLab\resources\runtime\python.exe"
          $app = "$env:OTRA_UNIDAD\MVDAXLab\resources\app"
          if (-not (Test-Path $py)) { throw "falta el runtime en la otra unidad" }
          $proc = Start-Process $py -PassThru -WindowStyle Hidden -ArgumentList `
            "-m", "streamlit", "run", "$app\app\app.py",
            "--server.port", "8766", "--server.headless", "true",
            "--browser.gatherUsageStats", "false"
          try {
            $ok = $false
            foreach ($i in 1..60) {
              Start-Sleep -Seconds 2
              try {
                if ((Invoke-WebRequest "http://127.0.0.1:8766" -UseBasicParsing `
                       -TimeoutSec 5).StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "la app instalada en otra unidad no respondió en 120 s" }
            Write-Host "respondió 200 corriendo desde $env:OTRA_UNIDAD"
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Comprobar que el registro sabe que está en la otra unidad
        shell: pwsh
        run: |
          # Esto es lo que usa Convertir-a-version-dueno.bat para encontrar
          # una instalación sin que le digan dónde: si no queda bien, ese
          # .bat no la va a encontrar en la máquina de un cliente que instaló
          # en otro disco.
          #
          # La primera versión de este paso pedía InstallLocation en la clave
          # de desinstalación y falló (corrida del 18/8) con la instalación
          # perfectamente hecha en D:. El motivo: electron-builder NUNCA
          # escribe InstallLocation ahí. Lo escribe en Software\<GUID>
          # (include/installer.nsh:104); bajo Uninstall solo pone DisplayName,
          # UninstallString, DisplayVersion, DisplayIcon y Publisher.
          #
          # Por eso el .bat tiene el fallback que tiene, y por eso este paso
          # ahora replica su cadena real en vez de inventar una propia:
          # InstallLocation si está, y si no la carpeta del DisplayIcon —que
          # lo escribe nuestro customInstall apuntando al .exe instalado—.
          # Se recorren las mismas tres raíces que recorre el .bat.
          $hallada = $null
          foreach ($raiz in @("HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall",
                              "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall",
                              "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall")) {
            foreach ($k in (Get-ChildItem $raiz -ErrorAction SilentlyContinue)) {
              $p = Get-ItemProperty $k.PSPath -ErrorAction SilentlyContinue
              if ($p.DisplayName -notlike "*MV DAX Lab*") { continue }
              $ruta = $p.InstallLocation
              if (-not $ruta -and $p.DisplayIcon) {
                $ruta = Split-Path ($p.DisplayIcon -replace ',\d+$', '') -Parent
              }
              Write-Host "entrada '$($p.DisplayName)' en $raiz -> '$ruta'"
              if ($ruta -like "$env:OTRA_UNIDAD*") { $hallada = $ruta }
            }
          }
          if (-not $hallada) {
            throw "ninguna entrada de desinstalación apunta a $env:OTRA_UNIDAD; " +
                  "Convertir-a-version-dueno.bat no encontraría esta instalación"
          }
          Write-Host "OK: el registro lleva a $hallada"

      - name: Desinstalar de la otra unidad
        shell: pwsh
        run: |
          $raiz = "$env:OTRA_UNIDAD\MVDAXLab"
          $des = Join-Path $raiz "Uninstall MV DAX Lab.exe"
          $p = Start-Process $des -ArgumentList '/S' -PassThru
          [void]$p.WaitForExit(180000)
          Start-Sleep -Seconds 15
          if (Test-Path (Join-Path $raiz "MV DAX Lab.exe")) {
            throw "el desinstalador dejó el ejecutable en la otra unidad"
          }
          Write-Host "desinstalación limpia en $env:OTRA_UNIDAD"

      # ------------------------------------------------------------------
      # La otra mitad de la distribución: el ZIP portable, que no instala
      # nada. Se prueba con el runtime embebido, que es como lo recibe quien
      # no puede instalar Python en su PC de trabajo.
      # ------------------------------------------------------------------
      - name: Armar los tres portables
        shell: pwsh
        working-directory: daxlingo
        env:
          MVDAX_LICENSE_SECRET: ${{ secrets.MVDAX_LICENSE_SECRET || env.MVDAX_SECRETO_EFIMERO }}
        run: |
          .\desktop\runtime\python.exe desktop/scripts/empaquetar-portable.py
          Get-ChildItem desktop/dist-portable -Filter *.zip |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      - name: El portable arranca y contesta 200
        shell: pwsh
        working-directory: daxlingo
        run: |
          $zip = "desktop/dist-portable/MV-DAX-Lab-portable.zip"
          Expand-Archive $zip -DestinationPath "$env:TEMP\port" -Force
          $carpeta = "$env:TEMP\port\MV-DAX-Lab-portable"
          # El runtime embebido va adentro del paquete: así el .bat lo
          # encuentra sin depender del Python del sistema.
          Copy-Item desktop/runtime "$carpeta\runtime" -Recurse

          $py = "$carpeta\runtime\python.exe"
          $p = Start-Process $py -PassThru -WindowStyle Hidden `
                 -ArgumentList "lanzador.py --sin-navegador --puerto 8796 --espera 90" `
                 -WorkingDirectory $carpeta
          try {
            $ok = $false
            foreach ($i in 1..60) {
              Start-Sleep -Seconds 2
              try {
                if ((Invoke-WebRequest "http://127.0.0.1:8796" -UseBasicParsing `
                       -TimeoutSec 5).StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "el portable no respondió en 120 s" }
            Write-Host "el portable respondió 200"
          } finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: El portable tampoco se convierte en owner con una variable
        shell: pwsh
        working-directory: daxlingo
        run: |
          $carpeta = "$env:TEMP\port\MV-DAX-Lab-portable"
          $env:MVDAXLAB_EDICION_ARCHIVO = "$carpeta\edicion.json"
          $env:MVDAXLAB_DATOS = "$env:TEMP\port-datos"
          $env:MVDAX_EDICION = "owner"          # el intento de bypass
          $ed = & "$carpeta\runtime\python.exe" -c `
            "import sys; sys.path.insert(0, r'$carpeta'); from dxl import licencia; print(licencia.edicion_actual())"
          Write-Host "edición del portable con MVDAX_EDICION=owner: $ed"
          if ($ed.Trim() -ne "profesional") { throw "el candado del portable no aguantó: $ed" }

      # ------------------------------------------------------------------
      # Solo cliente y demo. La owner NO se sube: repo público.
      # ------------------------------------------------------------------
      # La edición CLIENTE sí puede publicarse: desde que la prueba de 7 días
      # es exclusiva de la edición demo (ver dxl/licencia.py), este instalador
      # sin licencia válida no desbloquea nada. Sirve para que el que compró
      # lo baje solo, y no le sirve a nadie más.
      #
      # Salvo que esté sellado con la clave descartable de más arriba: en ese
      # caso rechazaría TODA licencia que emita la web, y el que compró se
      # encontraría con un producto que no abre. Un instalador que no existe
      # es mejor que uno que no anda.
      - name: Publicar el instalador de cliente
        if: env.SECRETO_REAL == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-windows
          retention-days: 30
          if-no-files-found: error
          path: |
            daxlingo/desktop/dist-instalador/MV-DAX-Lab-Setup-*.exe
            daxlingo/desktop/dist-portable/MV-DAX-Lab-portable.zip

      # ------------------------------------------------------------------
      # El instalador de CLIENTE, en un release publicado y con nombre fijo.
      #
      # Antes vivía solo como artifact, y eso dejaba al que pagaba sin nada:
      # los artifacts caducan a los 30 días, piden una cuenta de GitHub y en
      # un repo público los baja cualquiera. Inaccesible para el cliente y
      # accesible para el resto — al revés de lo que hace falta.
      #
      # Ahora va a un release con tag fijo (`programa-ultimo`) y nombre de
      # archivo SIN versión, para que la URL no cambie nunca: es la que
      # resuelve `api/descargar.js` después de comprobar el pago contra
      # MercadoPago. El artifact sigue existiendo para depurar.
      #
      # Que el release sea público no regala nada: desde que la prueba de 7
      # días es exclusiva de la edición demo (dxl/licencia.py), esta copia
      # sin licencia válida no desbloquea generar, transformar, exportar,
      # Fabric ni overlay. Y cuando el repositorio pase a privado, el enlace
      # sigue andando: `api/descargar.js` pide una URL firmada con
      # GITHUB_TOKEN.
      # ------------------------------------------------------------------
      - name: Publicar el instalador de cliente en un release
        if: env.SECRETO_REAL == 'si'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem daxlingo/desktop/dist-instalador `
                   -Filter "MV-DAX-Lab-Setup-*.exe" | Select-Object -First 1
          if (-not $exe) { throw "no se construyó el instalador de cliente" }

          # Nombre estable: la URL de descarga no puede cambiar con cada
          # versión, porque está horneada en el endpoint y en la página.
          $fijo = Join-Path $env:RUNNER_TEMP "MV-DAX-Lab-Setup.exe"
          Copy-Item $exe.FullName $fijo -Force

          $ErrorActionPreference = "Continue"
          gh release view programa-ultimo *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete programa-ultimo --yes }
          $global:LASTEXITCODE = 0
          $ErrorActionPreference = "Stop"

          gh release create programa-ultimo $fijo `
            --title "MV DAX Lab — instalador de Windows" `
            --notes @"
          Instalador de la edición que se vende. **Necesita una clave de licencia**: sin ella no
          desbloquea generar, transformar, exportar, Fabric ni overlay.

          Si compraste, la clave y el enlace de descarga salen en la página de descarga del sitio
          después de que MercadoPago confirma el pago. Si no compraste, esto no te sirve de nada
          — la demo se pide en https://power-bi-mv13.vercel.app/demo

          Build: $($exe.Name) — commit ${{ github.sha }}
          "@

          # Evidencia: el endpoint de descarga apunta a este nombre exacto.
          # Si el asset no quedó así, la descarga del cliente da 404.
          $assets = gh release view programa-ultimo --json assets --jq '.assets[].name'
          Write-Host "assets publicados: $assets"
          if ($assets -notcontains "MV-DAX-Lab-Setup.exe") {
            throw "el asset no quedó con el nombre fijo que espera api/descargar.js"
          }
          Write-Host "OK: descargable en releases/download/programa-ultimo/MV-DAX-Lab-Setup.exe"

      # ------------------------------------------------------------------
      # El instalador OWNER, en un release BORRADOR.
      #
      # El pedido es tener siempre un .exe de owner en GitHub para poder
      # probar el producto entero. El problema es que la edición owner
      # desbloquea todo sin licencia y sin vencimiento: subirla a un release
      # normal es regalar el producto a cualquiera que pase por el repo.
      #
      # Un release en BORRADOR resuelve las dos cosas a la vez. GitHub los
      # muestra ÚNICAMENTE a las cuentas con permiso de escritura sobre el
      # repositorio —o sea, al dueño, ya logueado— y no aparecen ni en la
      # pestaña Releases ni en la API para un visitante anónimo. Sirve igual
      # con el repo público (hoy) que privado (después), así que no depende
      # de acordarse de cambiar nada cuando cambie la visibilidad.
      #
      # ⚠️ NO le saques el `--draft`. Es lo único que separa "mi copia para
      # probar" de "el producto completo, gratis, para cualquiera".
      # ------------------------------------------------------------------
      - name: Dejar el instalador OWNER en un release borrador
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem daxlingo/desktop/dist-instalador `
                   -Filter "MV-DAX-Lab-OWNER-Setup-*.exe" |
                 Select-Object -First 1
          if (-not $exe) { throw "no se construyó el instalador owner" }

          # La DEMO va acá también, no en los artifacts. Desde que se entrega
          # a pedido en una reunión 1:1, publicarla sería contradecir la
          # decisión: cualquiera con una cuenta de GitHub se la bajaría.
          $demo = Get-ChildItem daxlingo/desktop/dist-instalador `
                    -Filter "MV-DAX-Lab-DEMO-Setup-*.exe" |
                  Select-Object -First 1
          if (-not $demo) { throw "no se construyó el instalador demo" }

          # Se borra y se recrea en vez de editar: `gh release upload` no
          # pisa un asset que ya existe con el mismo nombre, y así queda
          # siempre uno solo y siempre el último build.
          $ErrorActionPreference = "Continue"
          gh release view owner-ultimo *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete owner-ultimo --yes }
          $global:LASTEXITCODE = 0
          $ErrorActionPreference = "Stop"

          # Estas dos ediciones no dependen del secreto de licencias —owner
          # viene desbloqueada, demo cuenta por fecha—, así que se publican
          # igual esté configurado o no. La que sí depende es cliente, y de
          # eso habla esta línea.
          $sobreCliente = if ($env:SECRETO_REAL -eq "si") {
            "La edición que se vende (``cliente``) no está acá: esa se publica en los artifacts, y sin`n" +
            "licencia válida no desbloquea nada, así que no hay nada que regalar."
          } else {
            "⚠️ La edición que se vende (``cliente``) NO se publicó en esta corrida: el repositorio no`n" +
            "tiene configurado ``MVDAX_LICENSE_SECRET``, así que se construyó con una clave descartable`n" +
            "y rechazaría las licencias que emite la web. Cargá el secreto y volvé a correr el workflow."
          }

          gh release create owner-ultimo $exe.FullName $demo.FullName `
            --draft `
            --title "MV DAX Lab OWNER — solo para el dueño" `
            --notes @"
          Dos instaladores, los dos privados:

          - **OWNER** — todo desbloqueado, sin clave y sin vencimiento. Para probar el producto entero.
          - **DEMO** — 7 días con todo. Es el que le mandás a quien pide una demo por el formulario.

          $sobreCliente

          Este release es un **borrador**: solo lo ve quien tiene permiso de escritura en el repo.
          Publicarlo regala el producto entero. No lo publiques.

          Build: $($exe.Name) — commit ${{ github.sha }}
          "@

          # Evidencia, no confianza: si por lo que sea saliera publicado, el
          # paso tiene que fallar acá y no dejar el .exe expuesto.
          $esBorrador = (gh release view owner-ultimo --json isDraft --jq .isDraft).Trim()
          Write-Host "isDraft = $esBorrador"
          if ($esBorrador -ne "true") {
            gh release delete owner-ultimo --yes
            throw "el release de owner NO quedó en borrador — se borró por las dudas"
          }
          Write-Host "OK: owner quedó en un release borrador, invisible para el público"

      # ------------------------------------------------------------------
      # El resumen sale SIEMPRE (`if: always()`), también cuando algo falló:
      # es justo ahí donde saber si el build era publicable o de prueba
      # cambia cómo se lee el error.
      # ------------------------------------------------------------------
      - name: Resumen
        if: always()
        shell: pwsh
        run: |
          if ($env:SECRETO_REAL -eq "si") {
            @"
          ## Instaladores · build publicable

          ``MVDAX_LICENSE_SECRET`` está configurado, así que el instalador de **cliente** quedó
          sellado con la clave de producción y se publicó en los artifacts de esta corrida.

          Las ediciones **owner** y **demo** están en el release borrador ``owner-ultimo``.
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            return
          }

