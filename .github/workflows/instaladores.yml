# Construye los instaladores de Windows y los PRUEBA instalándolos.
#
# Existe porque el desarrollo pasa en Linux y un .exe de Windows no se puede
# ni compilar ni ejecutar ahí: sin este runner, "el instalador funciona" sería
# una afirmación sin respaldo. Acá se instala de verdad, se arranca el motor
# empaquetado, se comprueba el candado de la edición, se corre
# DESBLOQUEAR_OWNER.bat y se desinstala.
#
# La edición OWNER se construye para verificar que compila, pero NO se sube
# como artifact: este repositorio es público y cualquiera podría bajarla.
# Para tenerla: daxlingo/desktop/CONSTRUIR_OWNER.bat en tu máquina, o instalar
# la de cliente y pasarle DESBLOQUEAR_OWNER.bat.

name: Instaladores de Windows

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "daxlingo/desktop/**"
      - "daxlingo/dxl/**"
      - "daxlingo/app/**"
      - "daxlingo/requirements-app.txt"
      - ".github/workflows/instaladores.yml"

permissions:
  contents: read

env:
  PYTHON_EMBED: "3.11.9"
  INSTALL_DIR: "C:\\pruebainstal"

jobs:
  construir-y-probar:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ------------------------------------------------------------------
      # Runtime de Python embebido: es lo que hace que el cliente no tenga
      # que instalar Python. La carpeta va vacía en el repo (ver
      # desktop/runtime/LEEME.md), así que se arma acá.
      # ------------------------------------------------------------------
      - name: Preparar el runtime de Python embebido
        shell: pwsh
        working-directory: daxlingo/desktop
        run: |
          $ver = "${{ env.PYTHON_EMBED }}"
          $zip = "python-$ver-embed-amd64.zip"
          Invoke-WebRequest "https://www.python.org/ftp/python/$ver/$zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath runtime -Force
          Remove-Item $zip

          # Sin descomentar `import site`, pip instala pero nada se importa:
          # el runtime embebido arranca con el sistema de paquetes apagado.
          $pth = Get-ChildItem runtime -Filter "python*._pth" | Select-Object -First 1
          (Get-Content $pth.FullName) -replace '^#\s*import site', 'import site' |
            Set-Content $pth.FullName

          Invoke-WebRequest "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          .\runtime\python.exe get-pip.py --no-warn-script-location
          Remove-Item get-pip.py
          .\runtime\python.exe -m pip install --no-warn-script-location `
            -r ..\requirements-app.txt

      - name: Comprobar que el runtime arranca solo
        shell: pwsh
        working-directory: daxlingo/desktop
        run: |
          .\runtime\python.exe -c "import sys, streamlit; print('python', sys.version); print('streamlit', streamlit.__version__)"

      - name: Instalar dependencias de Node
        working-directory: daxlingo/desktop
        run: npm install

      # ------------------------------------------------------------------
      # Los tres instaladores. build-instaladores.js compila el front una vez
      # y hornea el sello de cada edición.
      # ------------------------------------------------------------------
      - name: Construir los tres instaladores
        working-directory: daxlingo/desktop
        env:
          MVDAX_LICENSE_SECRET: ${{ secrets.MVDAX_LICENSE_SECRET }}
        run: node scripts/build-instaladores.js todos

      - name: Listar lo construido
        shell: pwsh
        working-directory: daxlingo/desktop
        run: Get-ChildItem dist-instalador -Filter *.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      # ------------------------------------------------------------------
      # Instalación real, silenciosa, en un directorio elegido: eso prueba de
      # una vez el /S, el /D y que el paquete quedó completo.
      # ------------------------------------------------------------------
      - name: Instalar la edición cliente
        shell: pwsh
        working-directory: daxlingo/desktop
        run: |
          $exe = Get-ChildItem dist-instalador -Filter "MV-DAX-Lab-Setup-*.exe" |
                 Select-Object -First 1
          if (-not $exe) { throw "no se generó el instalador de cliente" }
          $destino = "${{ env.INSTALL_DIR }}"
          Write-Host "Instalando $($exe.Name) en $destino"

          # Los parámetros van en UN solo string a propósito: así llegan
          # tal cual, sin que PowerShell les agregue comillas. NSIS exige
          # que /D vaya último y sin comillar.
          #
          #   /S           silencioso
          #   /NCRC        saltea el chequeo CRC del .exe (son 176 MB)
          #   /currentuser fija el modo de instalación, que es lo que el
          #                paquete usa igual (nsis.perMachine: false)
          #   /D=          carpeta destino
          #
          # Sin -Wait, y con espera acotada a mano: el paquete tiene
          # `nsis.runAfterFinish: true`, así que al terminar el instalador
          # LANZA la app — y `Start-Process -Wait` se queda esperando a un
          # proceso que no va a salir nunca. Así colgó el primer intento
          # hasta el timeout del job.
          #
          # POR QUÉ SE REINTENTA
          # -------------------
          # El instalador se cae de manera INTERMITENTE con -1073741819
          # (0xC0000005) dentro de `System.dll`, el plugin System de NSIS,
          # a los ~2 s de arrancar y sin instalar nada. Pasó en 2 de 4
          # corridas del mismo código. No es el `/currentuser` ni el `/NCRC`
          # —se cayó igual con los dos puestos—, así que la causa sigue sin
          # estar identificada.
          #
          # Se reintenta para que la caída no tape los otros nueve pasos,
          # pero NO se disimula: cada intento fallido sale como ::warning::
          # y al final se dice cuántos hicieron falta. Si esto empieza a
          # necesitar 4 y 5 intentos seguido, es un problema del producto
          # —el cliente vería el mismo crash— y hay que ir al fondo.
          #
          # Cinco intentos y no tres: medido sobre seis instalaciones, la
          # caída sale una de cada dos. Con tres, el job quedaría rojo una
          # de cada ocho veces por una falla que no es del paso.
          $appExe = Join-Path $destino "MV DAX Lab.exe"
          $INTENTOS = 5
          $codigos = @()

          for ($intento = 1; $intento -le $INTENTOS; $intento++) {
            if ($intento -gt 1) {
              Write-Host "::warning::el instalador no dejó nada instalado; reintento $intento de $INTENTOS"
              Remove-Item $destino -Recurse -Force -ErrorAction SilentlyContinue
            }

            $p = Start-Process $exe.FullName -PassThru `
                   -ArgumentList "/S /NCRC /currentuser /D=$destino"
            if (-not $p.WaitForExit(300000)) {
              $p.Kill()
              throw "el instalador no terminó en 5 minutos"
            }
            $codigos += $p.ExitCode
            Write-Host "intento ${intento}: el instalador salió con $($p.ExitCode)"

            # El código de salida NO decide si terminó: los instaladores de
            # NSIS se relanzan y el proceso de arriba sale antes de que el
            # trabajo termine. Lo que decide es si la app quedó en disco.
            #
            # Pero sí sirve para no esperar al pedo: un instalador que se
            # cayó con 0xC0000005 no va a crear nada nunca, así que ahí se
            # espera 10 s en vez de 120 y se reintenta enseguida.
            $espera = if ($p.ExitCode -eq 0) { 60 } else { 5 }
            foreach ($i in 1..$espera) {
              if (Test-Path $appExe) { break }
              Start-Sleep -Seconds 2
            }

            Get-Process -Name "MV DAX Lab" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "bajando la app que abrió el instalador (PID $($_.Id))"; $_.Kill() }

            if (Test-Path $appExe) { break }
          }

          if ((Test-Path $appExe) -and ($codigos.Count -gt 1)) {
            Write-Host "::warning::la instalación necesitó $($codigos.Count) intentos (códigos: $($codigos -join ', '))"
          }

          if (-not (Test-Path $appExe)) {
            # Que el próximo run no vuelva a ser adivinanza: dónde se miró,
            # y qué dice Windows de la caída.
            Write-Host "--- no apareció $appExe; esto hay en cada candidato ---"
            foreach ($d in @($destino, "$env:LOCALAPPDATA\Programs", $env:ProgramFiles)) {
              Write-Host "· $d"
              Get-ChildItem $d -ErrorAction SilentlyContinue |
                Select-Object -First 20 |
                ForEach-Object { Write-Host "    $($_.Name)" }
            }
            Write-Host "--- caídas que registró Windows ---"
            Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001} `
                         -MaxEvents 5 -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host (($_.Message -split "`n" | Select-Object -First 5) -join ' | ') }
            throw "el instalador no dejó la app instalada en $INTENTOS intentos (códigos: $($codigos -join ', '))"
          }
          Write-Host "la app quedó instalada en $destino"

      - name: Comprobar lo que quedó instalado
        shell: pwsh
        run: |
          $raiz = "${{ env.INSTALL_DIR }}"
          $fallos = @()
          foreach ($r in @(
              "MV DAX Lab.exe",
              "Uninstall MV DAX Lab.exe",
              "resources\app\dxl\licencia.py",
              "resources\app\app\app.py",
              "resources\app\edicion.json",
              "resources\app\datos\demo\modelo_demo.bim",
              "resources\runtime\python.exe")) {
            if (Test-Path (Join-Path $raiz $r)) { Write-Host "  ok   $r" }
            else { $fallos += $r; Write-Host "  FALTA $r" }
          }
          if ($fallos) { throw "faltan en el paquete: $($fallos -join ', ')" }

      - name: Comprobar los accesos directos (escritorio y menú Inicio)
        shell: pwsh
        run: |
          $enEscritorio = Get-ChildItem ([Environment]::GetFolderPath('Desktop')),
                                        "$env:PUBLIC\Desktop" -Filter "MV DAX Lab.lnk" -ErrorAction SilentlyContinue
          $enMenu = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" `
                                  -Recurse -Filter "MV DAX Lab.lnk" -ErrorAction SilentlyContinue
          Write-Host "escritorio : $(if ($enEscritorio) { $enEscritorio[0].FullName } else { 'NO' })"
          Write-Host "menú Inicio: $(if ($enMenu) { $enMenu[0].FullName } else { 'NO' })"
          if (-not $enEscritorio) { throw "no quedó el acceso en el escritorio" }
          if (-not $enMenu) { throw "no quedó el acceso en el menú Inicio" }

      # ------------------------------------------------------------------
      # El candado de la edición, sobre la instalación de verdad.
      # ------------------------------------------------------------------
      - name: La copia vendida no se convierte en owner con una variable
        shell: pwsh
        run: |
          $raiz = "${{ env.INSTALL_DIR }}"
          $py = Join-Path $raiz "resources\runtime\python.exe"
          $app = Join-Path $raiz "resources\app"
          # Nada de PYTHONPATH: el runtime embebido trae un `._pth` al lado
          # del python.exe, y con ese archivo presente CPython ignora la
          # variable. La carpeta se agrega desde adentro. (La app real no
          # necesita nada de esto: app.py se pone su propia raíz en sys.path.)
          $env:MVDAXLAB_EDICION_ARCHIVO = Join-Path $app "edicion.json"
          $env:MVDAXLAB_DATOS = "$env:TEMP\mvdax-datos"
          $env:MVDAX_EDICION = "owner"          # el intento de bypass
          $ed = & $py -c "import sys; sys.path.insert(0, r'$app'); from dxl import licencia; print(licencia.edicion_actual())"
          Write-Host "edición con MVDAX_EDICION=owner puesta en contra: $ed"
          if ($ed.Trim() -ne "profesional") { throw "el candado no aguantó: $ed" }

      - name: Arrancar la app empaquetada y pedirle una página
        shell: pwsh
        run: |
          $raiz = "${{ env.INSTALL_DIR }}"
          $py = Join-Path $raiz "resources\runtime\python.exe"
          $app = Join-Path $raiz "resources\app"
          $proc = Start-Process $py -PassThru -WindowStyle Hidden -ArgumentList `
            "-m", "streamlit", "run", "$app\app\app.py",
            "--server.port", "8765", "--server.headless", "true",
            "--browser.gatherUsageStats", "false"
          try {
            $ok = $false
            foreach ($i in 1..60) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:8765" -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "la app empaquetada no respondió en 120 s" }
            Write-Host "la app empaquetada respondió 200"
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      # ------------------------------------------------------------------
      # Y ahora el .bat de owner, sobre esa misma instalación.
      # ------------------------------------------------------------------
      - name: Pasar la instalación a owner con DESBLOQUEAR_OWNER.bat
        shell: cmd
        run: |
          copy "daxlingo\desktop\DESBLOQUEAR_OWNER.bat" "${{ env.INSTALL_DIR }}\" >nul
          mkdir "${{ env.INSTALL_DIR }}\scripts" 2>nul
          copy "daxlingo\desktop\scripts\*.py" "${{ env.INSTALL_DIR }}\scripts\" >nul
          cd /d "${{ env.INSTALL_DIR }}"
          call DESBLOQUEAR_OWNER.bat < nul

      - name: Comprobar que quedó en owner, sin clave y sin vencimiento
        shell: pwsh
        run: |
          $raiz = "${{ env.INSTALL_DIR }}"
          $py = Join-Path $raiz "resources\runtime\python.exe"
          $app = Join-Path $raiz "resources\app"
          $env:MVDAXLAB_EDICION_ARCHIVO = Join-Path $app "edicion.json"
          $env:MVDAXLAB_DATOS = "$env:TEMP\mvdax-datos2"
          Remove-Item Env:\MVDAX_EDICION -ErrorAction SilentlyContinue
          # La carpeta de la app va por argumento, no por PYTHONPATH: ver el
          # comentario del paso del candado.
          $salida = (& $py "$raiz\scripts\estado_edicion.py" $app).Trim()
          Write-Host "estado tras el .bat: $salida"
          $partes = $salida.Split("|")
          if ($partes[0] -ne "owner") { throw "no quedó en owner: $salida" }
          if ($partes[1] -ne "True")  { throw "la edición owner no está activa" }
          if ($partes[2] -ne "None")  { throw "owner no debería vencer: $salida" }
          if ($partes[3] -ne "")      { throw "quedaron funciones trabadas: $($partes[3])" }

      - name: Revertir y comprobar que vuelve atrás
        shell: cmd
        run: |
          cd /d "${{ env.INSTALL_DIR }}"
          call DESBLOQUEAR_OWNER.bat /revertir < nul

      - name: Desinstalar y comprobar que no deja nada
        shell: pwsh
        run: |
          $raiz = "${{ env.INSTALL_DIR }}"
          $des = Join-Path $raiz "Uninstall MV DAX Lab.exe"
          # Espera acotada, por lo mismo que en la instalación: nada de
          # -Wait, que puede quedarse colgado esperando un proceso hijo.
          # El desinstalador de NSIS además se copia al temporal y se
          # relanza, así que el proceso original sale antes de terminar: de
          # ahí la espera de después.
          $p = Start-Process $des -ArgumentList '/S' -PassThru
          [void]$p.WaitForExit(180000)
          Start-Sleep -Seconds 15
          if (Test-Path (Join-Path $raiz "MV DAX Lab.exe")) {
            throw "el desinstalador dejó el ejecutable"
          }
          Write-Host "desinstalación limpia"

      # ------------------------------------------------------------------
      # La otra mitad de la distribución: el ZIP portable, que no instala
      # nada. Se prueba con el runtime embebido, que es como lo recibe quien
      # no puede instalar Python en su PC de trabajo.
      # ------------------------------------------------------------------
      - name: Armar los tres portables
        shell: pwsh
        working-directory: daxlingo
        env:
          MVDAX_LICENSE_SECRET: ${{ secrets.MVDAX_LICENSE_SECRET }}
        run: |
          .\desktop\runtime\python.exe desktop/scripts/empaquetar-portable.py
          Get-ChildItem desktop/dist-portable -Filter *.zip |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      - name: El portable arranca y contesta 200
        shell: pwsh
        working-directory: daxlingo
        run: |
          $zip = "desktop/dist-portable/MV-DAX-Lab-portable.zip"
          Expand-Archive $zip -DestinationPath "$env:TEMP\port" -Force
          $carpeta = "$env:TEMP\port\MV-DAX-Lab-portable"
          # El runtime embebido va adentro del paquete: así el .bat lo
          # encuentra sin depender del Python del sistema.
          Copy-Item desktop/runtime "$carpeta\runtime" -Recurse

          $py = "$carpeta\runtime\python.exe"
          $p = Start-Process $py -PassThru -WindowStyle Hidden `
                 -ArgumentList "lanzador.py --sin-navegador --puerto 8796 --espera 90" `
                 -WorkingDirectory $carpeta
          try {
            $ok = $false
            foreach ($i in 1..60) {
              Start-Sleep -Seconds 2
              try {
                if ((Invoke-WebRequest "http://127.0.0.1:8796" -UseBasicParsing `
                       -TimeoutSec 5).StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "el portable no respondió en 120 s" }
            Write-Host "el portable respondió 200"
          } finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: El portable tampoco se convierte en owner con una variable
        shell: pwsh
        working-directory: daxlingo
        run: |
          $carpeta = "$env:TEMP\port\MV-DAX-Lab-portable"
          $env:MVDAXLAB_EDICION_ARCHIVO = "$carpeta\edicion.json"
          $env:MVDAXLAB_DATOS = "$env:TEMP\port-datos"
          $env:MVDAX_EDICION = "owner"          # el intento de bypass
          $ed = & "$carpeta\runtime\python.exe" -c `
            "import sys; sys.path.insert(0, r'$carpeta'); from dxl import licencia; print(licencia.edicion_actual())"
          Write-Host "edición del portable con MVDAX_EDICION=owner: $ed"
          if ($ed.Trim() -ne "profesional") { throw "el candado del portable no aguantó: $ed" }

      # ------------------------------------------------------------------
      # Solo cliente y demo. La owner NO se sube: repo público.
      # ------------------------------------------------------------------
      - name: Publicar los instaladores de cliente y demo
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-windows
          retention-days: 30
          if-no-files-found: error
          path: |
            daxlingo/desktop/dist-instalador/MV-DAX-Lab-Setup-*.exe
            daxlingo/desktop/dist-instalador/MV-DAX-Lab-DEMO-Setup-*.exe
            daxlingo/desktop/dist-portable/MV-DAX-Lab-portable.zip
            daxlingo/desktop/dist-portable/MV-DAX-Lab-DEMO-portable.zip
