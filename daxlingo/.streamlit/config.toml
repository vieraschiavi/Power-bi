# Tema de MV DAX Lab — navy + ámbar, el mismo de la landing y del instalador.
# Sin esto, el marco de Streamlit sale claro y choca con la app.
[theme]
base = "dark"
primaryColor = "#f2b441"
backgroundColor = "#081527"
secondaryBackgroundColor = "#0c2137"
textColor = "#eaf1fb"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
headless = true
# Tope de subida. El default de Streamlit son 200 MB, y un .pbit/.pbix real
# rara vez pasa de 50: el modelo viaja comprimido y las capturas no van
# adentro. Bajarlo acota lo que puede pasar con un zip malicioso —el .zip de
# un PBIP se descomprime a disco, así que uno muy comprimido podría llenarlo—
# sin molestar a ningún archivo legítimo.
maxUploadSize = 64
